name: Sync from upstream
# Keeps main in step with GoogleChrome/modern-web-guidance, so the claude.ai
# plugin marketplace that points at this fork always has the newest plugin.
# Uses the merge-upstream API: a fast-forward or a merge commit, never a reset,
# so this workflow file survives. A conflict fails the run and GitHub emails the owner.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
